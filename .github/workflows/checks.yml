# Fast pre-deploy checks (backlog T1).
#
# Before this existed there was NO CI at all, while Vercel auto-deploys every push
# to `main` — so nothing stood between a mistake and the live site.
#
# HOW THE BLOCKING ACTUALLY WORKS — read this before changing anything:
#
#   This workflow does NOT stop a deploy. It cannot: Vercel starts building the
#   moment the push lands, so a separate CI job would be racing it and would
#   usually lose.
#
#   The deploy is stopped by `vercel.json`'s buildCommand:
#     npm run typecheck && npm run lint && npm run build
#   If typecheck or lint fails, the BUILD fails, so Vercel publishes nothing and the
#   previous deployment stays live. That is the real gate.
#
#   Why the deploy path is NOT `npm run verify`: verify also runs the unit tests,
#   which need Node 22's --experimental-strip-types (they import the .ts helpers the
#   edge functions share). Vercel's Node version is set in its dashboard, not here —
#   if it were Node 20, putting those tests in the deploy path would fail EVERY
#   deploy and turn this safety gate into a self-inflicted outage. So the unit tests
#   run here instead, on a Node 22 pinned below.
#
#   Consequence to be aware of: a unit-test failure shows up as a red mark here but
#   does NOT block the deploy. Typecheck, lint and build failures do block it.
#
# Scope decided by the maintainer (2026-08-23): fast checks only, ~2 minutes. The
# 115-assertion security suite stays a deliberate manual step before any auth-,
# email- or claim-related change, because it needs Docker and a local Supabase.

name: checks

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  # A newer push supersedes an in-flight run for the same ref.
  group: checks-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          # 22 is required: the unit tests run under --experimental-strip-types so
          # they can import the .ts helpers the edge functions share.
          node-version: '22'
          cache: 'npm'

      - name: Install
        run: npm ci

      - name: Typecheck, lint, unit tests
        run: npm run verify

      # Proves the S10 guard is live: a production build MUST refuse to complete
      # without VITE_TURNSTILE_SITE_KEY, because that value is inlined at build
      # time and an artifact without it blocks signup and club claims outright.
      # Asserting the failure is the point — a build that quietly succeeds here is
      # the exact regression that nearly took signup down on 2026-07-27.
      - name: Build must FAIL without the Turnstile key
        run: |
          if npm run build > /tmp/nokey.log 2>&1; then
            echo "::error::A production build SUCCEEDED with VITE_TURNSTILE_SITE_KEY unset."
            echo "::error::The guard in vite.config.ts is not working. Signup would ship broken."
            tail -30 /tmp/nokey.log
            exit 1
          fi
          echo "Correctly refused to build without the Turnstile key."
          grep -m1 'VITE_TURNSTILE_SITE_KEY' /tmp/nokey.log || true

      # Now prove it builds when the env is complete. Cloudflare's public test site
      # key always passes, so no real secret is needed to verify the build itself.
      - name: Production build
        env:
          VITE_TURNSTILE_SITE_KEY: 1x00000000000000000000AA
          VITE_SUPABASE_URL: https://ci-placeholder.supabase.co
          VITE_SUPABASE_PUBLISHABLE_KEY: ci-placeholder-anon-key
          VITE_SUPABASE_PROJECT_ID: ci-placeholder
        run: npm run build

      - name: Report bundle sizes
        run: |
          echo '### Bundle sizes' >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          du -h dist/assets/*.js 2>/dev/null | sort -rh | head -12 >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
