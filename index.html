<!doctype html>
<html lang="en" data-theme="light" style="color-scheme: light">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>ZotHub - UCI Club & Event Platform</title>
    <meta name="description" content="Discover opportunities, connect with clubs, and make the most of your UCI experience. Find leadership roles, events, and more from UCI's vibrant club ecosystem." />
    <meta name="author" content="ZotHub" />
    <meta name="keywords" content="UCI, clubs, events, opportunities, campus life, Anteaters, student organizations" />

    <!-- Favicons & app icons — branded stacked-disc mark (outlined Instrument Sans). Kit: /brand -->
    <link rel="icon" href="/favicon.ico" sizes="32x32" />
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="manifest" href="/site.webmanifest" />
    <meta name="theme-color" media="(prefers-color-scheme: light)" content="#FFFFFF" />
    <meta name="theme-color" media="(prefers-color-scheme: dark)" content="#0E0F10" />

    <meta property="og:title" content="ZotHub - Your Gateway to Campus Life" />
    <meta property="og:description" content="Discover opportunities, connect with clubs, and make the most of your UCI experience." />
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://zothub.app" />
    <meta property="og:site_name" content="ZotHub" />
    <meta property="og:image" content="https://zothub.app/og-image.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="ZotHub — your gateway to UCI campus life" />

    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="ZotHub - Your Gateway to Campus Life" />
    <meta name="twitter:description" content="Discover opportunities, connect with clubs, and make the most of your UCI experience." />
    <meta name="twitter:image" content="https://zothub.app/og-image.png" />
    <meta name="twitter:image:alt" content="ZotHub — your gateway to UCI campus life" />
    
    <link rel="canonical" href="https://zothub.app" />
    <script>
      // Applies the stored theme before first paint so the page never flashes
      // the wrong palette. Must stay in sync with the ThemeProvider in App.tsx:
      // attribute `data-theme`, storage key `theme`, light default.
      (function() {
        var stored = null;
        try { stored = localStorage.getItem('theme'); } catch (e) {}
        // No stored choice means light — that is the product default, not the
        // OS's. "system" is only honoured when the user explicitly picked it.
        var theme = 'light';
        if (stored === 'dark' || stored === 'light') {
          theme = stored;
        } else if (stored === 'system') {
          theme = window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
        }
        document.documentElement.setAttribute('data-theme', theme);
        document.documentElement.style.colorScheme = theme;
      })();
    </script>
  </head>

  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
