<!doctype html>
<html lang="en" class="light" style="color-scheme: light">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>ZotHub - UCI Club & Event Platform</title>
    <meta name="description" content="Discover opportunities, connect with clubs, and make the most of your UCI experience. Find leadership roles, events, and more from UCI's vibrant club ecosystem." />
    <meta name="author" content="ZotHub" />
    <meta name="keywords" content="UCI, clubs, events, opportunities, campus life, Anteaters, student organizations" />

    <meta property="og:title" content="ZotHub - Your Gateway to Campus Life" />
    <meta property="og:description" content="Discover opportunities, connect with clubs, and make the most of your UCI experience." />
    <meta property="og:type" content="website" />
    <meta property="og:image" content="https://lovable.dev/opengraph-image-p98pqg.png" />

    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:site" content="@ZotHub" />
    <meta name="twitter:image" content="https://lovable.dev/opengraph-image-p98pqg.png" />
    
    <link rel="canonical" href="https://zothub.app" />
    <script>
      (function() {
        const theme = localStorage.getItem('theme') || 'system';
        const systemDark = window.matchMedia('(prefers-color-scheme: dark)').matches;
        const isDark = theme === 'dark' || (theme === 'system' && systemDark);
        document.documentElement.classList.toggle('dark', isDark);
        document.documentElement.style.colorScheme = isDark ? 'dark' : 'light';
      })();
    </script>
  </head>

  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
